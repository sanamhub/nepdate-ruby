# Weekly: replaces shared/ with the hub's main, regenerates the tables and opens one PR on
# bot/shared-sync (hub ADR-0001 decision 3, docs/runbooks/data-update.md).
name: shared-sync

on:
  schedule:
    - cron: "47 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: sanamhub/nepdate/.github/workflows/shared-sync.yml@f71f3b6afe0366e16d76a0f4e0c00379cd7eaa92 # main 2026-11-03
    with:
      regenerate: ruby scripts/generate_tables.rb && ruby scripts/generate_patro_tables.rb
    secrets:
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
