# Installs one published version of both gems from RubyGems the way a user does, and checks them.
# release.yml calls it after the release; it also runs weekly on Linux, macOS and Windows. A
# scheduled failure opens or updates one issue labelled published-check.
name: verify-published

on:
  workflow_call:
    inputs:
      version:
        description: Published version, or latest for the newest version on RubyGems
        required: false
        default: latest
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Published version, or latest for the newest version on RubyGems
        required: false
        default: latest
        type: string
  schedule:
    # The weekly install check, Monday 06:41 UTC.
    - cron: "41 6 * * 1"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: resolve the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
      - name: Resolve
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-latest}"
          if [ "$version" = latest ]; then
            version="$(ruby -rjson -rnet/http -rrubygems -e '
              uri = URI("https://rubygems.org/api/v1/versions/nepdate.json")
              versions = JSON.parse(Net::HTTP.get(uri))
              latest = versions.max_by { |entry| Gem::Version.new(entry.fetch("number")) }
              abort "RubyGems serves no released version of nepdate yet" unless latest
              puts latest.fetch("number")
            ')"
          fi
          if [ -z "$version" ]; then
            echo "::error::RubyGems serves no released version of nepdate yet"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"

  weekly:
    name: weekly ${{ needs.resolve.outputs.version }} (${{ matrix.os }}, Ruby ${{ matrix.ruby }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.4", "4.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install the published gems
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          gem install nepdate -v "$VERSION" --no-document
          gem install nepdate-patro -v "$VERSION" --no-document
      - name: Check the installed gems
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: ruby scripts/published_smoke.rb "$VERSION"

  # The registry metadata check: both names still serve the version, with no package download.
  metadata:
    name: metadata ${{ needs.resolve.outputs.version }}
    if: github.event_name == 'schedule'
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the RubyGems listings
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          found=0
          for package in nepdate nepdate-patro; do
            if curl -fsS "https://rubygems.org/api/v1/versions/$package.json" \
              | jq -e --arg v "$VERSION" 'any(.number == $v)' >/dev/null; then
              echo "$package serves $VERSION"
              found=$((found + 1))
            else
              echo "::error::$package does not serve $VERSION on RubyGems"
            fi
          done
          test "$found" -eq 2

  # The only job with write access. It reads the failure and opens or updates one issue; it never
  # installs anything and never touches the registry.
  report:
    name: report
    if: failure() && github.event_name == 'schedule'
    needs: [resolve, weekly, metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the issue
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="published-check: nepdate $VERSION"
          body="The scheduled published check failed for \`$VERSION\` (\`$RUN_URL\`). See the run and the \`published-check\` label."
          number="$(gh issue list --label published-check --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label published-check
          fi
